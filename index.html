<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ختمة رمضان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07241f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar"><span id="status"></span><span><button id="installBtn" style="display:none">📲 تثبيت</button> <button id="loginBtn">🔐 دخول المشرف</button></span></div>
  <div class="moon">☪</div>
  <h1>ختمة رمضان</h1>
  <p class="verse">﴿ شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ ﴾</p>
</header>

<main>
  <section class="card">
    <h2>🌙 أيام رمضان</h2>
    <div id="days" class="days"></div>
    <div id="prog" class="prog"></div>
    <div class="legend"><span class="dot done"></span> تم التسجيل <span class="dot today"></span> اليوم</div>
  </section>

  <section class="card">
    <div class="dayhead">
      <h2 id="dayTitle"></h2>
      <span id="juz" class="badge"></span>
    </div>
    <div class="stopbox">
      <div class="stoplabel">📖 موضع التوقف</div>
      <div id="stopTxt" class="stoptxt"></div>
      <small id="stopFrom" class="stopfrom"></small>
      <div class="pick adm">
        <div class="pk"><span>السورة</span>
          <div class="stp"><button id="suP">›</button><select id="sura"></select><button id="suN">‹</button></div></div>
        <div class="pk"><span>الآية <small id="ayaMax"></small></span>
          <div class="stp"><button id="ay-10">−10</button><button id="ay-1">−</button><input type="number" id="aya" min="1"><button id="ay1">+</button><button id="ay10">+10</button></div></div>
        <div class="pk"><span>الصفحة</span>
          <div class="stp"><button id="pg-1">−</button><input type="number" id="pg" min="1" max="604"><button id="pg1">+</button></div>
          <input type="range" id="pgR" min="1" max="604"></div>
        <div class="stp quick"><button id="jStart">📍 بداية الجزء</button><button id="jEnd">🏁 أكملنا الجزء</button></div>
      </div>
    </div>
    <div class="add adm">
      <input id="newName" placeholder="اكتب اسم الطالب ثم اضغط إضافة">
      <button class="gold" id="addBtn">+ إضافة</button>
    </div>
    <div id="list"></div>
    <div id="summary" class="summary"></div>
    <div class="summary"><button class="adm" id="allP">✅ تحضير الكل</button><button id="wa">📲 تقرير اليوم</button></div>
  </section>

  <section class="card">
    <h2>🏆 ترتيب الحضور والسلوك</h2>
    <p class="hint" id="hint"></p>
    <div id="rank"></div>
  </section>

  <section class="card adm" id="panel">
    <h2>⚙ لوحة التحكم</h2>
    <label class="fld">أول يوم في رمضان: <input type="date" id="start"></label>
    <p class="hint">نقاط التقييم:</p>
    <div class="cfg">
      <label>حاضر <input type="number" id="cp"></label>
      <label>نصف الدورة <input type="number" id="ch"></label>
      <label>معتذر <input type="number" id="ce"></label>
      <label>غائب <input type="number" id="ca"></label>
      <label>سلوك مقبول <input type="number" id="c1"></label>
      <label>سلوك جيد <input type="number" id="c2"></label>
      <label>سلوك ممتاز <input type="number" id="c3"></label>
    </div>
    <div class="tools">
      <button id="exp">⬇ نسخة احتياطية</button>
      <label class="btn">⬆ استرجاع<input type="file" id="imp" accept=".json" hidden></label>
      <button onclick="print()">🖨 طباعة</button>
      <button class="danger" id="reset">🗑 تصفير كل البيانات</button>
      <button id="logout">🚪 خروج</button>
    </div>
  </section>
</main>
<footer>تقبّل الله منا ومنكم صالح الأعمال 🤍</footer>

<button id="sndBtn" class="fab" title="الأجواء الصوتية">🔊</button>
<div id="sndPanel" class="snd" hidden>
  <h3>🎧 أجواء رمضان</h3>
  <button id="ambBtn">🌙 أجواء هادئة</button>
  <button id="canBtn">💥 مدفع الإفطار</button>
  <button id="adhBtn">🕌 أذان</button>
  <button id="duaBtn">🤲 دعاء</button>
  <label>🔉 <input type="range" id="vol" min="0" max="1" step="0.05" value="0.6"></label>
  <label><input type="checkbox" id="sfxOn"> أصوات التفاعل الهادئة</label>
  <label>⏰ مدفع تلقائي وقت المغرب: <input type="time" id="iftar"></label>
  <small id="sndMsg"></small>
</div>

<dialog id="lg">
  <form method="dialog" id="lgForm">
    <h3>🔐 دخول المشرف</h3>
    <input type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password">
    <p id="lgErr" class="err"></p>
    <div class="row"><button class="gold" id="lgOk" type="button">دخول</button><button type="button" id="lgCancel">إلغاء</button></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
